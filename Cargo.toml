[package]
name = "ch32v307-ehci-debug"
version = "0.1.0"
edition = "2021"

[features]
default = ["acm-bridge"]
acm-bridge = []
# Requires a WCH-Link actively reading SDI output; leave off for ISP flashing.
sdi-log = []
# defmt logging over RTT, for `probe-rs run`/`probe-rs attach` with a WCH-Link.
# Also enables the HAL's and embassy-usb's own defmt logging.
defmt = ["dep:defmt", "dep:defmt-rtt", "ch32-hal/defmt", "embassy-usb/defmt"]
tcp-bridge = ["dep:embassy-net", "dep:embassy-net-driver", "dep:embedded-io-async", "dep:static_cell"]

[dependencies]
# Pin the same USB-tested HAL for local builds and GitHub Pages firmware.
ch32-hal = { git = "https://github.com/ArthurHeymans/ch32-hal", rev = "a41ea930ab79079ab74443157948f455a520009c", features = [
    "ch32v307vct6",
    "memory-x",
    "embassy",
    "rt",
    "highcode",
] }
embassy-executor = { version = "0.10.0", features = ["platform-spin", "executor-thread"] }
defmt = { version = "1.0", optional = true }
defmt-rtt = { version = "1.0", optional = true }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", optional = true, features = ["tcp", "dhcpv4", "medium-ethernet", "proto-ipv4"] }
embassy-net-driver = { version = "0.2.0", optional = true }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = "0.6.0"
embassy-usb-driver = "0.2.2"
embedded-io-async = { version = "0.7", optional = true }
portable-atomic = { version = "1", features = ["critical-section"] }
qingke = "0.8"
qingke-rt = { version = "0.8", features = ["highcode"] }
static_cell = { version = "2.1", optional = true }

[profile.release]
strip = false
lto = true
opt-level = "z"

# The embassy-usb debug-extension support (embassy-rs/embassy#6408) is merged
# but not yet in a crates.io release. Match ch32-hal's git source and revision
# so the HAL and embassy-usb use the same USB driver trait.
[patch.crates-io]
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "27d398592b8a8c415c54eb04a0893aa9ef20316d" }
embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy", rev = "27d398592b8a8c415c54eb04a0893aa9ef20316d" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "27d398592b8a8c415c54eb04a0893aa9ef20316d" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "27d398592b8a8c415c54eb04a0893aa9ef20316d" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "27d398592b8a8c415c54eb04a0893aa9ef20316d" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "27d398592b8a8c415c54eb04a0893aa9ef20316d" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy", rev = "27d398592b8a8c415c54eb04a0893aa9ef20316d" }
embassy-net-driver-channel = { git = "https://github.com/embassy-rs/embassy", rev = "27d398592b8a8c415c54eb04a0893aa9ef20316d" }
# embassy-time-queue-utils at this revision asks its own copy of
# embassy-executor-timer-queue (0.1.1) for a 6-word per-task timer item. A
# crates.io embassy-executor links a second copy (0.1.0) that reserves zero
# words, so timers never arm and the queue writes past the task header. Take
# the executor from the same revision so both share one timer-queue crate.
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "27d398592b8a8c415c54eb04a0893aa9ef20316d" }
embassy-executor-macros = { git = "https://github.com/embassy-rs/embassy", rev = "27d398592b8a8c415c54eb04a0893aa9ef20316d" }
embassy-executor-timer-queue = { git = "https://github.com/embassy-rs/embassy", rev = "27d398592b8a8c415c54eb04a0893aa9ef20316d" }
