[package]
name = "ch32v307-ehci-debug"
version = "0.1.0"
edition = "2021"

[features]
default = ["acm-bridge"]
acm-bridge = []
tcp-bridge = ["dep:embassy-net", "dep:embassy-net-driver", "dep:embedded-io-async", "dep:static_cell"]

[dependencies]
ch32-hal = { path = "../ch32-hal", features = [
    "ch32v307vct6",
    "memory-x",
    "embassy",
    "rt",
    "highcode",
] }
embassy-executor = { version = "0.10.0", features = ["platform-spin", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", optional = true, features = ["tcp", "dhcpv4", "medium-ethernet", "proto-ipv4"] }
embassy-net-driver = { version = "0.2.0", optional = true }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = "0.6.0"
embassy-usb-driver = "0.2.2"
embedded-io-async = { version = "0.7", optional = true }
panic-halt = "1.0"
portable-atomic = { version = "1", features = ["critical-section"] }
qingke = "0.7"
qingke-rt = { version = "0.7", features = ["highcode"] }
static_cell = { version = "2.1", optional = true }

[profile.release]
strip = false
lto = true
opt-level = "z"

# The embassy-usb debug-extension support (embassy-rs/embassy#6408) is merged
# but not yet in a crates.io release; track embassy main until it ships.
[patch.crates-io]
embassy-usb = { git = "https://github.com/embassy-rs/embassy.git", branch = "main" }
embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy.git", branch = "main" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy.git", branch = "main" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", branch = "main" }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", branch = "main" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy.git", branch = "main" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy.git", branch = "main" }
embassy-net-driver-channel = { git = "https://github.com/embassy-rs/embassy.git", branch = "main" }
